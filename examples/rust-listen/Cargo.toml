[package]
name = "link-listen-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rutis = "=0.21.0"
rutis-bridge = "=0.21.0"

[dev-dependencies]
serde_json = "1"
getrandom = "0.2"
rutis-bridge = { version = "=0.21.0", features = ["websocket"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
