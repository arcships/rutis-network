name: Quick checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.list.outputs.go }}
      ts: ${{ steps.list.outputs.ts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Discover modules and packages
        id: list
        run: |
          for lang in go ts; do
            projects=$(make -s "list-$lang" | jq -Rnce '[inputs | select(length > 0)] | select(length > 0)')
            echo "$lang=$projects" >> "$GITHUB_OUTPUT"
          done

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: link/tcp/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: make fmt-check

  go:
    name: Go / ${{ matrix.module }}
    needs: projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.projects.outputs.go) }}
    env:
      GO_MODULES: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            link/tcp/go.sum
      - run: make go-vet GO_MODULES="$GO_MODULES"
      - run: make go-test GO_MODULES="$GO_MODULES"

  typescript:
    name: TypeScript / ${{ matrix.package }}
    needs: projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.projects.outputs.ts) }}
    env:
      TS_PACKAGES: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: make ts-setup TS_PACKAGES="$TS_PACKAGES"
      - run: make typecheck TS_PACKAGES="$TS_PACKAGES"
      - run: make ts-test TS_PACKAGES="$TS_PACKAGES"
