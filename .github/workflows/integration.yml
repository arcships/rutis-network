name: Transport integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: transport-integration-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - name: Select integration suites
        id: select
        shell: bash
        run: |
          revisions=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The PR checkout is the test merge commit; its first parent is the base.
            revisions=(HEAD^1 HEAD)
          fi
          suites=$(node scripts/integration-matrix.mjs "${revisions[@]}")
          echo "Selected suites: $suites"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  integration:
    needs: scope
    if: needs.scope.outputs.suites != '[]'
    name: Integration / ${{ matrix.suite.transport }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.scope.outputs.suites) }}
    env:
      TRANSPORT: ${{ matrix.suite.transport }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            link/tcp/go.sum
            link/${{ matrix.suite.transport }}/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: ${{ matrix.suite.package }}/package-lock.json
      - name: Install locked dependencies and check the native host
        working-directory: ${{ matrix.suite.package }}
        run: |
          npm ci
          node_modules/.bin/rutis-host --version
      - name: Install Chromium, Firefox and their system dependencies
        if: matrix.suite.transport == 'webrtc'
        working-directory: ${{ matrix.suite.package }}
        run: node_modules/.bin/playwright install --with-deps chromium firefox
      - run: make "integration-$TRANSPORT"
      - name: Pack the WebRTC browser ESM and declarations
        if: matrix.suite.transport == 'webrtc'
        id: pack
        working-directory: ${{ matrix.suite.package }}
        shell: bash
        run: |
          filename=$(npm pack --json --pack-destination "$RUNNER_TEMP" | jq -er '.[0].filename')
          echo "archive=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"
      - name: Install the tarball, type-check the consumer and run browser RPC
        if: matrix.suite.transport == 'webrtc'
        working-directory: ${{ matrix.suite.package }}
        env:
          WEBRTC_TARBALL: ${{ steps.pack.outputs.archive }}
        run: npm run test:package
      - name: Upload the verified npm tarball
        if: matrix.suite.transport == 'webrtc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webrtc-npm-package
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
