name: Plugin release

on:
  push:
    tags:
      - 'link/tcp/v*'
      - 'link/ssh/v*'
      - 'link/tailscale/v*'
      - 'link/cloudflared/v*'
      - 'link/grpc/v*'
      - 'link/libp2p/v*'
      - 'link/webrtc/v*'
      - 'link/websocket/v*'
      - 'discovery/mdns/v*'
      - 'group/peer/v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package the tagged plugin
    if: "!github.event.deleted"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: startsWith(github.ref_name, 'link/webrtc/') || startsWith(github.ref_name, 'link/tcp/')
        with:
          node-version: '22.18.0'
      - name: Build the shared WebRTC browser bundle
        if: startsWith(github.ref_name, 'link/webrtc/')
        working-directory: link/webrtc/web
        run: |
          npm ci
          npm run build
      - name: Cross-compile and archive the plugin
        run: scripts/package-plugin.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
      - name: Load the Linux TCP archive in stock hosts
        if: startsWith(github.ref_name, 'link/tcp/')
        run: |
          npm ci --prefix link/tcp/node
          scripts/test-tcp-archive.sh "$RUNNER_TEMP/assets" "${GITHUB_REF_NAME##*/}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Publish archives and checksums together
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(*.tar.gz *.zip SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --json assets,isDraft > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              # A completed release can be retried, but its published assets are immutable.
              jq -r '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' "$RUNNER_TEMP/release.json" \
                | LC_ALL=C sort > "$RUNNER_TEMP/published"
              sha256sum "${files[@]}" | LC_ALL=C sort | diff - "$RUNNER_TEMP/published"
            fi
          else
            flags=()
            if [[ ${GITHUB_REF_NAME##*/} == *-* ]]; then flags+=(--prerelease); fi
            notes="Download the archive for your OS and CPU and check its SHA-256 against SHA256SUMS. Extract plugins/go/ into your host project."
            if [[ ${GITHUB_REF_NAME%/*} == discovery/mdns ]]; then
              notes+=" DNS-SD publishing and interface-bound description HTTP require macOS or Linux. Linux publishing also requires Avahi and its DNS-SD compatibility library."
            elif [[ ${GITHUB_REF_NAME%/*} == link/grpc ]]; then
              notes+=" The bin/ directory contains the standalone grpc-cloud directory and relay executable."
            fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "$notes" "${flags[@]}"
          fi
