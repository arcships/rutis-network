name: RCP mobile
on:
  pull_request:
    paths:
      - 'link/rcp/**'
      - 'link/tcp/*.go'
      - 'link/tcp/go.*'
      - '.go-version'
      - 'Makefile'
      - 'scripts/test-rcp-mobile.sh'
      - 'scripts/in-go-module.sh'
      - '.github/workflows/rcp-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'link/rcp/**'
      - '.github/workflows/rcp-mobile.yml'
permissions:
  contents: read
concurrency:
  group: rcp-mobile-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  interop:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            link/rcp/go.sum
            link/tcp/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Kotlin, Swift and Go wire interoperability
        run: make integration-rcp-mobile
      - name: Compile for iOS
        working-directory: link/rcp/swift
        run: swift build -c release --target RutisRCP --triple arm64-apple-ios15.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android library and on-device vector test
        working-directory: link/rcp/kotlin
        run: ./gradlew -Pandroid=true :android:assembleRelease :android:assembleDebugAndroidTest
